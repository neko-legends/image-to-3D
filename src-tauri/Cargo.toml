[package]
name = "image-to-3d"
version = "26.11.9"
description = "Local image-to-3D workflow app"
authors = ["Image To 3D contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "image_to_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
